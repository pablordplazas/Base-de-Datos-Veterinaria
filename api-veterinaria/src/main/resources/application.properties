spring.application.name=api-veterinaria
server.port=8081

# Configuración con H2 Database (Local, sin fallos de red ni contraseñas)
spring.datasource.url=jdbc:h2:mem:veterinariadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA / Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar la consola web de H2 (opcional, para ver los datos en http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ruta de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html